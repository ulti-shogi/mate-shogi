<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>将棋の殿堂 - 歴代タイトル獲得ランキング</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<div class="header-section">
<h1>歴代タイトル獲得ランキング</h1>
<p class="subtitle">公式タイトル戦の全対局結果から、各棋士の獲得・登場回数および勝率を自動集計</p>
</div>
<div class="container">
<div class="controls">
<input type="text" id="searchInput" placeholder="棋士名で検索...">
</div>
<table id="titleTable">
<thead>
<tr>
<th></th>
<th>棋士名</th>
<th class="sortable" data-sort="appearCount">登場<div class="sort-icon"></div></th>
<th class="sortable desc" data-sort="titleCount">獲得<div class="sort-icon"></div></th>
<th class="sortable" data-sort="loseCount">敗北<div class="sort-icon"></div></th>
<th class="sortable" data-sort="winRate">勝率<div class="sort-icon"></div></th>
<th class="tablet-col pc-col">獲得タイトル内訳</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
<div id="emptyMessage" class="empty-message" style="display: none; padding: 20px;">
該当する棋士が見つかりません。
</div>
</div>
<footer>
<p>&copy; 2026 将棋の殿堂</p>
</footer>
<!-- 外部のJSファイルを読み込む -->
<script src="title.js"></script>
</body>
</html>
