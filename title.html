<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将棋の殿堂 - 歴代タイトル獲得ランキング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-section">
    <h1>歴代タイトル獲得ランキング</h1>
    <p class="subtitle">公式タイトル戦の全対局結果から、各棋士の獲得・登場回数および勝率を自動集計</p>
</div>

<div class="container">
    <div class="controls">
        <input type="text" id="searchInput" placeholder="棋士名で検索...">
        <select id="sortSelect" class="dynamic-select">
            <option value="titleCount-desc">獲得数 (多度順)</option>
            <option value="appearCount-desc">登場回数 (多度順)</option>
            <option value="winRate-desc">獲得率 (高順)</option>
        </select>
    </div>

    <table id="titleTable">
        <thead>
            <tr>
                <th class="sortable asc" data-sort="rank">順位<div class="sort-icon"></div></th>
                <th class="sortable" data-sort="name">棋士名<div class="sort-icon"></div></th>
                <th class="sortable" data-sort="titleCount">獲得数<div class="sort-icon"></div></th>
                <th class="sortable" data-sort="appearCount">登場回数<div class="sort-icon"></div></th>
                <th class="sortable pc-col" data-sort="loseCount">敗北数<div class="sort-icon"></div></th>
                <th class="sortable" data-sort="winRate">獲得率<div class="sort-icon"></div></th>
                <th class="tablet-col pc-col">獲得タイトル内訳</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
    
    <div id="emptyMessage" class="empty-message" style="display: none; padding: 20px;">
        該当する棋士が見つかりません。
    </div>
</div>

<footer>
    <p>&copy; 2026 将棋の殿堂</p>
</footer>

<script>
// 小数点第4位まで切り捨て（四捨五入なし）の関数
function floorTo4Decimal(num) {
    if (isNaN(num) || num === 0) return "0.0000";
    // 浮動小数点の誤差対策として文字列で処理
    const str = num.toString();
    const dotIndex = str.indexOf('.');
    if (dotIndex === -1) return num.toFixed(4);
    return (str + "0000").substring(0, dotIndex + 5);
}

// データの非同期読み込みと集計メインロジック
async function initRanking() {
    try {
        // ※ 本番のCSVファイル名に合わせて調整してください
        const response = await fetch('タイトル戦対局結果.txt');
        if (!response.ok) throw new Error('ファイルの読み込みに失敗しました');
        
        const text = await response.text();
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length < 2) return;

        // 1. ヘッダー行から列名とインデックスのマッピングを作成（列位置に依存しない）
        const header = lines[0].split(',');
        const colMap = {};
        header.forEach((colName, index) => {
            colMap[colName.trim()] = index;
        });

        // 必須列名の存在チェック
        const requiredCols = ['the', 'match', 'phase', 'player_A', 'player_B', 'a', 'b'];
        for (const col of requiredCols) {
            if (colMap[col] === undefined) {
                console.error(`必須列 "${col}" がCSVに見つかりません。`);
                return;
            }
        }

        // 2. 対局データをパースして番勝負（シリーズ）ごとに集約
        const seriesData = {};

        for (let i = 1; i < lines.length; i++) {
            // コメント行やソース行のスキップ
            if (lines[i].startsWith('.split(',');
            const match = cells[colMap['match']]?.trim();
            const the = cells[colMap['the']]?.trim();
            const phase = cells[colMap['phase']]?.trim();
            const playerA = cells[colMap['player_A']]?.trim();
            const playerB = cells[colMap['player_B']]?.trim();
            const resultA = cells[colMap['a']]?.trim();
            const resultB = cells[colMap['b']]?.trim();

            if (!match || !the || !playerA || !playerB || playerB === "未定") continue;

            // シリーズを識別するユニークキー (例: "84-名人戦")
            const seriesKey = `${the}-${match}`;

            if (!seriesData[seriesKey]) {
                // 番勝負に応じた既定勝利数の判定
                let requiredWins = 4; // 七番勝負をデフォルトに
                if (phase && (phase.includes('五番勝負') || phase.includes('5番勝負'))) {
                    requiredWins = 3;
                }

                seriesData[seriesKey] = {
                    match: match,
                    the: the,
                    playerA: playerA,
                    playerB: playerB,
                    winsA: 0,
                    winsB: 0,
                    requiredWins: requiredWins,
                    hasStarted: false
                };
            }

            // 有効な勝敗のみカウント（千日手・持将棋・未来スケジュールは除外）
            if (resultA === '☆') {
                seriesData[seriesKey].winsA++;
                seriesData[seriesKey].hasStarted = true;
            } else if (resultB === '☆') {
                seriesData[seriesKey].winsB++;
                seriesData[seriesKey].hasStarted = true;
            } else if (resultA === '★' || resultB === '★') {
                seriesData[seriesKey].hasStarted = true; // 結果が出ているなら開始済み
            }
        }

        // 3. 棋士ごとのスタッツ（獲得・登場・敗北）を集計
        const kishiStats = {};

        function getOrCreateKishi(name) {
            if (!kishiStats[name]) {
                kishiStats[name] = {
                    name: name,
                    titleCount: 0,
                    appearCount: 0,
                    loseCount: 0,
                    titles: {} // 棋戦ごとの内訳 { "名人戦": 2, "竜王戦": 1 }
                };
            }
            return kishiStats[name];
        }

        Object.values(seriesData).forEach(s => {
            const isFinishedA = s.winsA >= s.requiredWins;
            const isFinishedB = s.winsB >= s.requiredWins;
            const isFinished = isFinishedA || isFinishedB;

            // シリーズが決定している、もしくは進行中の場合のみ「登場」とみなす
            if (isFinished || s.hasStarted) {
                const pA = getOrCreateKishi(s.playerA);
                const pB = getOrCreateKishi(s.playerB);

                pA.appearCount++;
                pB.appearCount++;

                if (isFinished) {
                    if (isFinishedA) {
                        pA.titleCount++;
                        pB.loseCount++;
                        pA.titles[s.match] = (pA.titles[s.match] || 0) + 1;
                    } else {
                        pB.titleCount++;
                        pA.loseCount++;
                        pB.titles[s.match] = (pB.titles[s.match] || 0) + 1;
                    }
                }
            }
        });

        // 4. 配列への変換と獲得率（勝率）の計算
        let rankingArray = Object.values(kishiStats).map(k => {
            // 獲得率 = 獲得数 ÷ 登場回数
            const winRate = k.appearCount > 0 ? (k.titleCount / k.appearCount) : 0;
            return {
                ...k,
                winRate: winRate
            };
        });

        // デフォルトのソート（獲得数降順、同数の場合は登場回数降順）
        sortData(rankingArray, 'titleCount', 'desc');
        renderTable(rankingArray);

        // イベントリスナーの設定（検索・ソート）
        setupControls(rankingArray);

    } catch (error) {
        console.error('エラーが発生しました:', error);
    }
}

// テーブルへのレンダリング処理
function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
        document.getElementById('emptyMessage').style.display = 'block';
        return;
    }
    document.getElementById('emptyMessage').style.display = 'none';

    data.forEach((k, index) => {
        // 内訳文字列の構築 (例: "名人(2) 竜王(1)")
        const titleDetails = Object.entries(k.titles)
            .map(([match, count]) => `${match.replace('戦', '')}(${count})`)
            .join(' ');

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${k.rank}</td>
            <td style="font-weight: bold; text-align: left; padding-left: 15px;">${k.name}</td>
            <td style="font-weight: bold; color: #1a3622;">${k.titleCount}</td>
            <td>${k.appearCount}</td>
            <td class="pc-col">${k.loseCount}</td>
            <td style="font-variant-numeric: tabular-nums;">${floorTo4Decimal(k.winRate)}</td>
            <td class="tablet-col pc-col" style="text-align: left; padding-left: 10px; color: #666; font-size: 12px;">${titleDetails || '-'}</td>
        `;
        tbody.appendChild(tr);
    });
}

// データのソート関数（同順位判定ロジック含む）
function sortData(data, field, direction) {
    data.sort((a, b) => {
        let valA = a[field];
        let valB = b[field];

        // 獲得率・獲得数・登場数で同値の場合の第2セカンダリソートは名前順
        if (valA === valB) {
            return a.name.localeCompare(b.name, 'ja');
        }

        return direction === 'asc' ? valA - valB : valB - valA;
    });

    // 順位（同率順位）の再計算（獲得数ベース）
    let currentRank = 1;
    data.forEach((item, index) => {
        if (index > 0 && data[index - 1][field] !== item[field] && direction === 'desc') {
            currentRank = index + 1;
        }
        item.rank = currentRank;
    });
}

// コントロール系（UIイベント）の制御
function setupControls(allData) {
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const thList = document.querySelectorAll('#titleTable th.sortable');

    function filterAndSort() {
        const query = searchInput.value.trim();
        let filtered = allData.filter(k => k.name.includes(query));

        // セレクトボックスまたはヘッダーの選択状態からソート条件を取得
        const [field, direction] = sortSelect.value.split('-');
        sortData(filtered, field, direction);
        renderTable(filtered);
    }

    // 検索入力イベント
    searchInput.addEventListener('input', filterAndSort);

    // セレクトボックス変更イベント
    sortSelect.addEventListener('change', (e) => {
        const [field, direction] = e.target.value.split('-');
        
        // テーブルヘッダーのクラス表示も同期させる
        thList.forEach(th => {
            th.classList.remove('asc', 'desc');
            if (th.dataset.sort === field) {
                th.classList.add(direction);
            }
        });
        filterAndSort();
    });

    // テーブルヘッダークリックによるソート機能
    thList.forEach(th => {
        th.addEventListener('click', () => {
            const field = th.dataset.sort;
            let direction = 'desc';

            if (th.classList.contains('desc')) {
                direction = 'asc';
            } else if (th.classList.contains('asc')) {
                direction = 'desc';
            }

            // ヘッダークラスの更新
            thList.forEach(h => h.classList.remove('asc', 'desc'));
            th.classList.add(direction);

            // セレクトボックス側の選択値も同期
            sortSelect.value = `${field}-${direction}`;

            filterAndSort();
        });
    });
}

// ページ読み込み時に実行
document.addEventListener('DOMContentLoaded', initRanking);
</script>
</body>
</html>
