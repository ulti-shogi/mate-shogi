<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴代タイトル獲得ランキング - 将棋の殿堂</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>

<div class="container">
    <h1><a href="index.html" style="text-decoration: none; color: inherit;">将棋の殿堂</a></h1>

    <div class="average-card">
        <h2 class="average-title" style="margin-bottom:0;">タイトル戦 記録・ランキング</h2>
        <p class="average-desc" style="margin-top: 10px;">公式タイトル戦の全対局結果から、各棋士の獲得ランキングや各年度・棋戦ごとの結果を表示</p>
    </div>

    <!-- タブ切り替えボタン -->
    <div class="tabs">
        <button class="tab-btn active" data-target="panel-ranking">ランキング</button>
        <button class="tab-btn" data-target="panel-yearly">各年度結果</button>
        <button class="tab-btn" data-target="panel-match">各棋戦結果</button>
    </div>

    <!-- 💡 1. ランキング パネル -->
    <div id="panel-ranking" class="panel active">
        <table id="titleTable">
            <thead>
                <tr>
                    <th></th>
                    <th>棋士名</th>
                    <th class="sortable" data-sort="appearCount">登場<span class="sort-icon"></span></th>
                    <th class="sortable desc" data-sort="titleCount">獲得<span class="sort-icon"></span></th>
                    <th class="sortable" data-sort="loseCount">敗北<span class="sort-icon"></span></th>
                    <th class="sortable" data-sort="winRate">勝率<span class="sort-icon"></span></th>
                    <th class="tablet-col pc-col">獲得タイトル内訳</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 💡 2. 各年度結果 パネル -->
    <div id="panel-yearly" class="panel" style="display: none;">
        <div class="filter-area">
            <label>年度： <select id="yearSelect"></select></label>
        </div>
        <table id="yearlyTable">
            <thead>
                <tr>
                    <!-- 💡 列の順番を入れ替えました -->
                    <th>期</th>
                    <th>棋戦</th>
                    <th style="width: 25%;">保持者</th>
                    <th></th>
                    <th></th>
                    <th style="width: 25%;">挑戦者</th>
                </tr>
            </thead>
            <tbody id="yearlyTableBody"></tbody>
        </table>
        <div id="yearlyEmptyMessage" class="empty-message" style="display: none; padding: 20px;">データがありません。</div>
    </div>

    <!-- 💡 3. 各棋戦結果 パネル -->
    <div id="panel-match" class="panel" style="display: none;">
        <div class="filter-area">
            <label>棋戦： <select id="matchSelect"></select></label>
        </div>
        <table id="matchTable">
            <thead>
                <tr>
                    <th>期</th>
                    <th>年度</th>
                    <th style="width: 25%;">保持者</th>
                    <th></th>
                    <th></th>
                    <th style="width: 25%;">挑戦者</th>
                </tr>
            </thead>
            <tbody id="matchTableBody"></tbody>
        </table>
        <div id="matchEmptyMessage" class="empty-message" style="display: none; padding: 20px;">データがありません。</div>
    </div>

</div>

<footer>
    <p>&copy; 2026 将棋の殿堂</p>
</footer>

<!-- 外部のJSファイルを読み込む -->
<script src="title.js"></script>
</body>
</html>
