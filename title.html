<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴代タイトル獲得ランキング - 将棋の殿堂</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <style>
        /* 検索エリアのスタイル追加 */
        .search-area {
            background-color: #f0ebd8;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-area label {
            font-weight: bold;
            color: #1a3622;
        }
        .search-area input[type="text"] {
            padding: 5px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 250px;
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><a href="index.html" style="text-decoration: none; color: inherit;">将棋の殿堂</a></h1>

    <div class="average-card">
        <h2 class="average-title" style="margin-bottom:0;">歴代タイトル獲得ランキング</h2>
        <p class="average-desc" style="margin-top: 10px;">公式タイトル戦の全対局結果から、各棋士の獲得・登場回数および勝率を自動集計</p>
    </div>

    <div class="search-area">
        <label>棋士名検索：
            <input type="text" id="searchInput" placeholder="棋士名を入力...">
        </label>
    </div>

    <div id="list-view">
        <div class="panel active">
            <table id="titleTable">
                <thead>
                    <tr>
                        <th></th>
                        <th>棋士名</th>
                        <th class="sortable" data-sort="appearCount">登場<span class="sort-icon"></span></th>
                        <th class="sortable desc" data-sort="titleCount">獲得<span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="loseCount">敗北<span class="sort-icon"></span></th>
                        <th class="sortable" data-sort="winRate">勝率<span class="sort-icon"></span></th>
                        <th class="tablet-col pc-col">獲得タイトル内訳</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            
            <div id="emptyMessage" class="empty-message" style="display: none; padding: 20px;">
                該当する棋士が見つかりません。
            </div>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 将棋の殿堂</p>
</footer>

<!-- 外部のJSファイルを読み込む -->
<script src="title.js"></script>
</body>
</html>
